<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>점프업 아파트</title>
<meta name="description" content="내 아파트 시세에 추가금을 더해 수도권에서 올라갈 수 있는 단지와 비슷한 시세의 타지역 단지를 보여줘요.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a6b78">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: desktop = narrow control column on the left, ranked results on the right; phone = one column, controls first. */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#121d29; --sub:#566474; --line:#d5dce5; --chip:#e4eaf0;
  --brand:#0a6b78; --brand-ink:#ffffff; --jump:#c9481a; --jump-soft:#fbe7de;
  --ok:#17794a; --warn:#9a5b00;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-num:"Space Grotesk","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161e; --surface:#17212b; --ink:#e7edf3; --sub:#98a5b3; --line:#29353f; --chip:#212d38;
  --brand:#3fc1cf; --brand-ink:#06222a; --jump:#ff8a5c; --jump-soft:#3a2318;
  --ok:#5fd68a; --warn:#e8b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161e; --surface:#17212b; --ink:#e7edf3; --sub:#98a5b3; --line:#29353f; --chip:#212d38;
  --brand:#3fc1cf; --brand-ink:#06222a; --jump:#ff8a5c; --jump-soft:#3a2318;
  --ok:#5fd68a; --warn:#e8b04a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700;text-wrap:balance}
.lede{margin:0 0 12px;color:var(--sub);font-size:14px;max-width:60ch}
.notice{margin:0 0 16px;padding:10px 12px;border:1px dashed var(--warn);border-radius:10px;color:var(--ink);font-size:13px;background:var(--surface)}
.notice b{color:var(--warn)}
.notice.real{border-style:solid;border-color:var(--line)}
.notice.real b{color:var(--brand)}
.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:stretch}
.col{min-width:0;display:grid;gap:12px;align-content:start}
.coltitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--sub);margin:0 0 -4px}
.coltitle i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:12px}
.coltitle.r i{background:var(--jump);color:#fff}
.cond .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px 14px;align-items:start}
.guchips{margin-top:8px;max-height:128px;overflow:auto;padding:2px}
.guchips button{padding:5px 10px;font-size:12px}
.cond details{margin-top:10px;font-size:13px;color:var(--sub)}
.cond summary{cursor:pointer;padding:4px 0}
.cond details .seg{margin-top:6px}
/* 데스크톱·가로 화면: 좌(내 아파트) / 우(비교 단지)를 한 화면에 두고 각자 스크롤 */
@media (min-width:821px){
  body{height:max(640px,100dvh);display:flex;flex-direction:column;padding-block:12px 12px}
  .wrap{width:100%;flex:1;min-height:0;display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:22px;margin:0}
  .lede{display:none}
  .notice{margin:6px 0 10px;padding:6px 10px;font-size:12px}
  .grid{flex:1;min-height:0}
  .col{overflow:auto;min-height:0;align-content:start;padding-right:4px;scrollbar-gutter:stable}
  .aptlist{max-height:30dvh}
}
@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:6px 0;margin-bottom:6px}
  .aptlist{max-height:240px}
  .cond .row2{grid-template-columns:minmax(0,1fr)}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);margin:12px 0 6px}
.lab:first-child{margin-top:0}
input[type=search],input[type=number]{width:100%;font:16px var(--f-body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=number]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.search{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px #0003}
.sug button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:14px;cursor:pointer}
.sug button:last-child{border-bottom:0}
.sug button:hover{background:var(--chip)}
.sug small{display:block;color:var(--sub);font-size:12px}
.seg{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:10px}
.seg button{flex:1;padding:8px 6px;border:0;border-radius:8px;background:none;color:var(--sub);font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px #0002}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink);font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.readout{margin:6px 0 8px;font-family:var(--f-num);font-size:13px;color:var(--jump);font-weight:700;min-height:20px}
.mine{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nm{font-weight:700;font-size:16px}
.meta{color:var(--sub);font-size:13px}
.price{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;letter-spacing:-.01em}
.price small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--sub);margin-left:2px}
.sm{font-size:12px;color:var(--sub)}
.metrics{display:grid;gap:4px;margin-top:8px}
.m{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.ml{width:30px;color:var(--sub);font-size:12px;flex:none}
.mt{min-width:0}
.dots{display:inline-flex;gap:3px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 8px;border:0;border-radius:9px;background:none;color:var(--sub);font-size:14px;font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px #0002}
.tabs button.jump[aria-selected="true"]{color:var(--jump)}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.sum{font-size:14px;min-width:0}
.sum b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sum .hl{color:var(--jump)}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--sub)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts .seg{min-width:200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.card .r{text-align:right}
.delta{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.delta.up{color:var(--jump)} .delta.dn{color:var(--brand)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--sub);margin-left:6px;vertical-align:2px}
.tag.low{background:var(--jump-soft);color:var(--warn)}
.score{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--brand)}
.notes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.note{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip)}
.note.good{color:var(--ok)} .note.bad{color:var(--warn)}
.card .metrics{grid-column:1/-1}
.empty{padding:28px 12px;text-align:center;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.more{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink);font-size:14px;cursor:pointer}
.foot{margin:16px 0 0;font-size:12px;color:var(--sub);line-height:1.6}
select{width:100%;font:16px var(--f-body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
select:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.aptlist{display:grid;gap:6px;margin-top:8px;max-height:340px;overflow:auto}
.aptrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:2px 6px 2px 2px;background:var(--bg)}
.aptrow[aria-current="true"]{border-color:var(--brand);background:var(--surface)}
.apt-pick{display:block;width:100%;min-width:0;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;font-size:14px;cursor:pointer}
.apt-pick b{display:block;font-weight:700}
.apt-pick > span{display:block;color:var(--sub);font-size:12px}
.mapbtn{display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border-radius:9px;border:1px solid var(--brand);color:var(--brand);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.mapbtn:hover{background:var(--brand);color:var(--brand-ink)}
.cardfoot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.cardfoot .notes{margin:0}
.mine .cardfoot{margin-top:10px;justify-content:flex-end}
.tag{margin-left:6px}
@media (max-width:420px){.card{grid-template-columns:minmax(0,1fr)}.card .r{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>점프업 아파트</h1>
    <p class="lede">내 아파트 시세에 추가금을 더하면 수도권 어디까지 올라갈 수 있는지, 같은 시세의 다른 지역은 어디인지 보여줘요.</p>
  </header>
  <p class="notice" id="notice" role="note">불러오는 중…</p>

  <div class="grid">
    <section class="col" aria-label="내 아파트 고르기">
      <div class="coltitle"><i>1</i>내 아파트</div>
      <section class="panel" aria-label="내 아파트">
        <div class="lab">내 아파트 · 지역</div>
        <div class="chips" id="sidoChips">
          <button type="button" data-sido="서울" aria-pressed="true">서울</button>
          <button type="button" data-sido="경기" aria-pressed="false">경기</button>
          <button type="button" data-sido="인천" aria-pressed="false">인천</button>
        </div>
        <label class="lab" for="gu">구·시</label>
        <select id="gu"></select>
        <label class="lab" for="q">단지 이름으로 좁히기</label>
        <input id="q" type="search" placeholder="예: 늘봄" autocomplete="off">
        <div id="aptHint" class="sm" style="margin-top:8px"></div>
        <div id="aptList" class="aptlist"><div class="empty">단지 목록 불러오는 중…</div></div>
        <div class="lab">전용면적</div>
        <div class="seg" id="areaSeg">
          <button type="button" data-area="59" aria-pressed="false">59㎡</button>
          <button type="button" data-area="84" aria-pressed="true">84㎡</button>
        </div>
        <div id="mine" class="mine"></div>
      </section>
    </section>
    <main class="col" aria-label="비교 단지">
      <div class="coltitle r"><i>2</i>비교 단지</div>
      <section class="panel cond" aria-label="조건"><div class="row2"><div><label class="lab" for="extra">추가로 쓸 수 있는 금액 (만원)</label>
        <input id="extra" type="number" inputmode="numeric" min="0" step="1000">
        <div id="extraRead" class="readout"></div>
        <div class="chips" id="extraChips">
          <button type="button" data-add="5000" aria-pressed="false">+5천만</button>
          <button type="button" data-add="10000" aria-pressed="false">+1억</button>
          <button type="button" data-add="20000" aria-pressed="false">+2억</button>
          <button type="button" data-add="30000" aria-pressed="false">+3억</button>
          <button type="button" data-add="50000" aria-pressed="false">+5억</button>
        </div>
        </div><div><div class="lab">지역</div>
        <div class="chips" id="regionChips">
          <button type="button" data-region="all" aria-pressed="true">수도권 전체</button>
          <button type="button" data-region="서울" aria-pressed="false">서울</button>
          <button type="button" data-region="경기" aria-pressed="false">경기</button>
          <button type="button" data-region="인천" aria-pressed="false">인천</button>
        </div>
        <div class="chips guchips" id="guChips" role="group" aria-label="비교할 구·시 (여러 개 선택 가능)" hidden></div>
        </div></div><details><summary>지도 보기에 쓸 앱</summary>
        <div class="seg" id="provSeg">
          <button type="button" data-prov="naverland" aria-pressed="true">네이버부동산</button>
          <button type="button" data-prov="navermap" aria-pressed="false">네이버지도</button>
          <button type="button" data-prov="kakao" aria-pressed="false">카카오맵</button>
        </div>
      </details></section>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tJump" class="jump" aria-selected="true">점프업 후보</button>
        <button type="button" role="tab" id="tSim" aria-selected="false">비슷한 시세</button>
      </div>
      <div class="bar"><div id="sum" class="sum"></div></div>
      <div id="opts" class="opts"></div>
      <div id="list"></div>
      <p class="foot" id="foot"></p>
    </main>
  </div>
</div>

<script>
/* ---------- 샘플 데이터 (data.json이 없을 때만 쓰는 가상 값) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const D=[
['서울','강남구',260000],['서울','서초구',250000],['서울','송파구',210000],['서울','용산구',230000],['서울','성동구',170000],
['서울','마포구',150000],['서울','광진구',140000],['서울','양천구',150000],['서울','강동구',120000],['서울','영등포구',125000],
['서울','동작구',140000],['서울','서대문구',100000],['서울','강서구',95000],['서울','노원구',75000],['서울','도봉구',62000],
['서울','관악구',78000],['서울','구로구',72000],['서울','은평구',80000],['서울','중랑구',68000],['서울','강북구',60000],
['경기','성남시 분당구',135000],['경기','과천시',160000],['경기','하남시',115000],['경기','광명시',105000],['경기','수원시 영통구',80000],
['경기','용인시 수지구',85000],['경기','고양시 일산서구',62000],['경기','부천시',62000],['경기','안양시 동안구',85000],['경기','의정부시',48000],
['경기','남양주시',58000],['경기','화성시',78000],['경기','김포시',52000],['경기','시흥시',48000],['경기','구리시',80000],
['인천','연수구',75000],['인천','서구',60000],['인천','부평구',45000],['인천','계양구',42000]
];
const PRE=['늘봄','한결','푸른솔','다온','하늬','새론','라온','아람','해오름','보람','가온','이든'];
const SUF=['마을','아파트','파크','힐스','타운'];
function makeSample(){
  const R=rng(20261118),out=[];
  for(const [sido,gu,base] of D){
    for(let k=0;k<6;k++){
      const year=Math.round(1993+R()*31);
      const p84=Math.round(base*(1+(year-2008)*0.007)*(0.88+R()*0.26)/100)*100;
      const p59=Math.round(p84*(0.69+R()*0.07)/100)*100;
      out.push({sido,gu,dong:'',
        name:PRE[Math.floor(R()*PRE.length)]+SUF[Math.floor(R()*SUF.length)]+' '+(k+1)+'단지',
        year,p59,p84,n59:1+Math.floor(R()*12),n84:1+Math.floor(R()*14),
        walk:3+Math.floor(R()*18),school:150+Math.floor(R()*1050),amen:2+Math.floor(R()*11)});
    }
  }
  return out;
}

/* ---------- 유틸 ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function fmt(v){
  v=Math.round(v);
  if(v===0)return '0';
  const eok=Math.floor(v/10000),man=v%10000;
  if(eok&&man)return eok+'억 '+man.toLocaleString('ko-KR')+'만';
  if(eok)return eok+'억';
  return man.toLocaleString('ko-KR')+'만';
}
const dots=v=>{const n=Math.round(v);return '<span class="dots" aria-hidden="true">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</span>'};
const metric=(l,v,t)=>'<div class="m"><span class="ml">'+l+'</span>'+dots(v)+'<span class="mt">'+t+'</span></div>';
const metrics=c=>c.walk==null?'':'<div class="metrics">'+metric('교통',c.tS,'지하철 도보 '+c.walk+'분')+metric('학군',c.sS,'초등학교 '+c.school.toLocaleString('ko-KR')+'m')+metric('편의',c.aS,'생활시설 '+c.amen+'곳')+'</div>';
const where=c=>c.sido+' '+c.gu+(c.dong?' '+c.dong:'');
const metaLine=c=>[where(c),c.year?c.year+'년 준공':''].filter(Boolean).join(' · ');

/* ---------- 데이터 ---------- */
let DATA=[],GU={},BYKEY=new Map(),REAL=false,HAS_LIFE=false,META=null;
const ckey=c=>[c.sido,c.gu,c.dong||'',c.name].join('|');
function setData(list,real,meta){
  REAL=real;META=meta||null;
  DATA=list.map((c,i)=>Object.assign({},c,{id:i,key:ckey(c)}));
  HAS_LIFE=DATA.some(c=>c.walk!=null);
  const g={};BYKEY=new Map();
  for(const c of DATA){
    BYKEY.set(c.key,c);
    (g[c.sido]=g[c.sido]||new Set()).add(c.gu);
    if(c.walk!=null){
      c.tS=clamp(5-(c.walk-3)*4/17,1,5);c.sS=clamp(5-(c.school-150)*4/1050,1,5);c.aS=clamp(1+(c.amen-2)*4/10,1,5);
      c.score=+(0.4*c.tS+0.3*c.sS+0.3*c.aS).toFixed(1);
    }
  }
  GU={};for(const k in g)GU[k]=[...g[k]].sort((x,y)=>x.localeCompare(y,'ko'));
}

/* ---------- 단지 이름 바뀐 곳(재건축 등): aliases.json, 없어도 괜찮아요 ---------- */
function applyAlias(list){
  for(const c of DATA){c.aka=[];c.now=''}
  for(const a of (Array.isArray(list)?list:[])){
    if(!a||!a.old||!a.new)continue;
    for(const c of DATA){
      if(a.gu&&c.gu!==a.gu)continue;
      if(c.name===a.new&&!c.aka.includes(a.old))c.aka.push(a.old);
      if(c.name===a.old)c.now=a.new;
    }
  }
}
const nameTag=c=>c.aka&&c.aka.length?'<span class="tag">구 '+esc(c.aka.join(', '))+'</span>':(c.now?'<span class="tag low">현 '+esc(c.now)+'</span>':'');

/* ---------- 상태 ---------- */
const KEY='jumpup_v2';
const PROVIDERS={naverland:'네이버부동산',navermap:'네이버지도',kakao:'카카오맵'};
const state={mine:null,sido:'서울',gu:'노원구',q:'',provider:'naverland',area:'84',extra:10000,region:'all',rgus:[],tab:'jump',sort:'score',better:true,other:true,tol:10,limit:20};
const mine=()=>state.mine==null?null:(DATA[state.mine]||null);
const price=c=>state.area==='59'?c.p59:c.p84;
const cnt=c=>state.area==='59'?c.n59:c.n84;
const hasP=c=>price(c)!=null;
const bmo=c=>state.area==='59'?c.b59:c.b84;
const lastD=c=>state.area==='59'?c.l59:c.l84;
const fmtDay=s=>{const a=(s||'').split('-');return a.length===3?(+a[1])+'.'+(+a[2]):a.length===2?(+a[1])+'월':''};
function basisText(c){
  if(!REAL)return '거래 '+cnt(c)+'건';
  const b=bmo(c),per=META&&META.period?(META.period.split('~')):[],tot=per.length===2?((+per[1].slice(0,4))*12+ +per[1].slice(4))-((+per[0].slice(0,4))*12+ +per[0].slice(4))+1:12;
  return (b&&b<tot?'최근 '+b+'개월':'최근 '+tot+'개월')+' '+cnt(c)+'건';
}
function lastText(c){
  const l=lastD(c);if(!REAL||!l)return '';
  return '최근 거래 '+fmt(l[0])+'원 · '+fmtDay(l[1])+(l[2]!=null?' · '+l[2]+'층':'');
}
const sortMode=()=>HAS_LIFE?state.sort:'price';
function save(){try{const m=mine();localStorage.setItem(KEY,JSON.stringify({mineKey:m?m.key:null,sido:state.sido,gu:state.gu,provider:state.provider,area:state.area,extra:state.extra,region:state.region,rgus:state.rgus}))}catch(e){}}
function restore(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;
    if(s.mineKey&&BYKEY.has(s.mineKey)){const c=BYKEY.get(s.mineKey);state.mine=c.id;state.sido=c.sido;state.gu=c.gu}
    if(GU[s.sido]&&GU[s.sido].includes(s.gu)){state.sido=s.sido;state.gu=s.gu}
    if(s.area==='59'||s.area==='84')state.area=s.area;
    if(Number.isFinite(s.extra)&&s.extra>=0)state.extra=s.extra;
    if(['all','서울','경기','인천'].includes(s.region))state.region=s.region;
    if(state.region!=='all'&&Array.isArray(s.rgus))state.rgus=s.rgus.filter(g=>(GU[state.region]||[]).includes(g));
    if(PROVIDERS[s.provider])state.provider=s.provider;
  }catch(e){}
}

/* 지도 링크: 새 탭으로 열려서 지도를 닫으면 점파트 화면이 그대로 남는다 */
function mapUrl(c){
  const q=REAL?[c.sido,c.gu,c.dong,c.name].filter(Boolean).join(' '):c.sido+' '+c.gu;
  const e=encodeURIComponent(q);
  if(state.provider==='navermap')return 'https://map.naver.com/p/search/'+e;
  if(state.provider==='kakao')return 'https://map.kakao.com/link/search/'+e;
  return 'https://new.land.naver.com/search?sk='+e;
}
const mapLink=(c,label)=>'<a class="mapbtn" href="'+esc(mapUrl(c))+'" target="_blank" rel="noopener" aria-label="'+esc(c.name)+' 지도 보기, 새 탭에서 열려요">'+(label||'지도 보기 ↗')+'</a>';

/* ---------- 계산 ---------- */
function candidates(){
  const m=mine();if(!m)return [];
  const base=price(m);if(base==null)return [];
  let list=DATA.filter(c=>c.id!==m.id&&hasP(c)&&(state.region==='all'||(c.sido===state.region&&(!state.rgus.length||state.rgus.includes(c.gu)))));
  if(state.tab==='jump'){
    const top=base+state.extra;
    list=list.filter(c=>{const p=price(c);return p>base&&p<=top});
    if(HAS_LIFE&&state.better&&m.score!=null)list=list.filter(c=>c.score>m.score);
  }else{
    const lo=base*(1-state.tol/100),hi=base*(1+state.tol/100);
    list=list.filter(c=>{const p=price(c);return p>=lo&&p<=hi});
    if(state.other)list=list.filter(c=>c.sido!==m.sido||c.gu!==m.gu);
  }
  const sm=sortMode();
  list.sort((a,b)=>{
    if(sm==='price')return state.tab==='jump'?price(b)-price(a):Math.abs(price(a)-base)-Math.abs(price(b)-base);
    return b.score-a.score||price(a)-price(b);
  });
  return list;
}
function notes(c,m){
  const out=[];
  if(c.walk!=null&&m.walk!=null){
    const dw=m.walk-c.walk;if(Math.abs(dw)>=2)out.push([dw>0,'역 '+Math.abs(dw)+'분 '+(dw>0?'가까움':'멂')]);
  }
  if(c.year&&m.year){const dy=c.year-m.year;if(Math.abs(dy)>=3)out.push([dy>0,Math.abs(dy)+'년 '+(dy>0?'더 새 단지':'더 오래됨')])}
  if(c.walk!=null&&m.walk!=null){
    const ds=m.school-c.school;if(Math.abs(ds)>=200)out.push([ds>0,'학교 '+Math.abs(ds)+'m '+(ds>0?'가까움':'멂')]);
    const da=c.amen-m.amen;if(Math.abs(da)>=2)out.push([da>0,'생활시설 '+Math.abs(da)+'곳 '+(da>0?'많음':'적음')]);
  }
  return out;
}

/* ---------- 시작: data.json이 있으면 실제 단지, 없으면 샘플 ---------- */
async function init(){
  let real=null;
  try{
    const r=await fetch('data.json',{cache:'no-cache'});
    if(r.ok){const j=await r.json();if(j&&Array.isArray(j.complexes)&&j.complexes.length>0)real=j}
  }catch(e){}
  if(real)setData(real.complexes,true,real);else setData(makeSample(),false,null);
  let al=[];try{const r=await fetch('aliases.json',{cache:'no-cache'});if(r.ok)al=await r.json()}catch(e){}
  applyAlias(al);
  state.sido=GU['서울']?'서울':(Object.keys(GU)[0]||'서울');
  const gus=GU[state.sido]||[''];
  state.gu=gus.includes('노원구')?'노원구':gus[0];
  if(!REAL){const c=DATA.find(c=>c.sido===state.sido&&c.gu===state.gu);if(c)state.mine=c.id}
  restore();
  render();
}
init();
</script>
